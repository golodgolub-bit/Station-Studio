<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;padding:26px;background:#f7f4fb;color:#2b2433;font:14px Arial,sans-serif}h1{font-size:25px;letter-spacing:-1px;font-weight:500}p{line-height:1.6;color:#7d6c8b}.preview{padding:32px 20px;border-radius:20px;background:#e5d7f5;min-height:110px;text-align:center;margin:24px 0;display:grid;place-items:center}label{display:grid;gap:9px;margin:18px 0}input,button{font:inherit;border:1px solid #e1d4ee;border-radius:12px;padding:13px;background:white;color:#7044a1;min-height:44px}input[type=range]{width:100%}button{background:#7739ef;color:white;border:0;width:100%;cursor:pointer}button:disabled{opacity:.5}:focus-visible{outline:3px solid #b28be5;outline-offset:3px}@media(prefers-reduced-motion:no-preference){.preview{transition:background .2s}}</style><h1>Мастерская</h1><p>Пример отдельного интерфейса. Меняет только собственные параметры плагина.</p><div class="preview" id="preview"></div><label>Подпись<input id="caption" maxlength="100"></label><label>Насыщенность превью<input id="level" type="range" min="0" max="100" step="5"></label><button id="save" disabled>Сохранить</button><p id="state" role="status">Читаем настройки…</p><script>
let counter=0;const requests=new Map(),$=id=>document.getElementById(id);function call(action,values){return new Promise((resolve,reject)=>{const id='demo-'+(++counter);const timer=setTimeout(()=>{requests.delete(id);reject(Error('Панель не ответила'))},10000);requests.set(id,{resolve,reject,timer});parent.postMessage({channel:'station-studio-v1',id,action,values},'*')})}addEventListener('message',e=>{if(e.source!==parent||e.data?.channel!=='station-studio-v1')return;const q=requests.get(e.data.id);if(!q)return;requests.delete(e.data.id);clearTimeout(q.timer);e.data.error?q.reject(Error(e.data.error)):q.resolve(e.data.result)});function preview(){$('preview').textContent=$('caption').value;$('preview').style.background='hsl(270,'+(+$('level').value*.5)+'%,85%)'}$('caption').oninput=$('level').oninput=preview;call('settings.read').then(j=>{$('caption').value=j.values.caption;$('level').value=j.values.level;preview();$('save').disabled=false;$('state').textContent='Настройки доступны только этому плагину.'}).catch(e=>$('state').textContent=e.message);$('save').onclick=async()=>{$('save').disabled=true;try{await call('settings.write',{caption:$('caption').value,level:+$('level').value});$('state').textContent='Сохранено. Значения доступны службе плагина.'}catch(e){$('state').textContent=e.message}finally{$('save').disabled=false}};
</script></html>
