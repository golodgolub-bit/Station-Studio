<!doctype html><html lang="ru"><meta charset="utf-8"><style>*{box-sizing:border-box}html,body{height:100%;margin:0!important;padding:0!important;overflow:hidden;background:#f7f4fb}body{display:flex;flex-direction:column}header{flex-shrink:0;padding:12px 22px 0}h1{font-size:22px;letter-spacing:-.7px;margin:0}p{font-size:12px;color:#766486;margin:4px 0}canvas{display:block;width:100%;height:0;min-height:80px;flex:1;touch-action:none}.controls{flex-shrink:0;display:flex;gap:10px;padding:8px 22px;align-items:center;flex-wrap:wrap}button{min-height:44px}.controls span{font-size:11px}#state{font-size:12px;color:#6a587b;min-height:18px}</style><header><h1>Orbit</h1><p id="state" role="status">Загружаем локальные ресурсы…</p></header><canvas id="scene" aria-label="Трёхмерная орбитальная скульптура"></canvas><div class="controls"><button id="pause">Пауза</button><button id="reset">Вернуть ракурс</button><span>Проведите пальцем или используйте стрелки и OK</span></div><script>
// Bootstrap can request an own manifest-bound library without any network access.
let seq=0;function asset(path){return new Promise((resolve,reject)=>{const id='bootstrap-'+(++seq),timeout=setTimeout(()=>{removeEventListener('message',receive);reject(Error('Ресурс не получен'))},15000);function receive(e){if(e.source!==parent||e.data?.channel!=='station-studio-v1'||e.data.id!==id)return;clearTimeout(timeout);removeEventListener('message',receive);e.data.error?reject(Error(e.data.error)):resolve(e.data.result)}addEventListener('message',receive);parent.postMessage({channel:'station-studio-v1',id,action:'assets.read',path},'*')})}
(async()=>{const resource=await asset('assets/bridge.js'),script=document.createElement('script');script.textContent=new TextDecoder().decode(resource.bytes);document.head.append(script);if(!window.AliceKitBridge)throw Error('Локальная библиотека не запустилась');const call=AliceKitBridge.call,palette=JSON.parse(new TextDecoder().decode((await call('assets.read',{path:'assets/palette.json'})).bytes)),settings=await call('settings.read'),runtime=await call('runtime.info');let moving=settings.values.motion,speed=settings.values.speed,yaw=0,pitch=0,time=0,last=0,raf=0,disposed=false;const canvas=document.getElementById('scene'),state=document.getElementById('state'),pause=document.getElementById('pause');
function label(){pause.textContent=moving?'Пауза':'Продолжить'}label();const gl=canvas.getContext('webgl',{antialias:true,alpha:false});if(!gl){state.textContent='WebGL недоступен. Стандартные настройки плагина работают; откройте сцену на другом устройстве.';return}
let program,buffer;function init(){function shader(t,s){const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(sh));return sh}program=gl.createProgram();const vs=shader(gl.VERTEX_SHADER,'attribute vec3 p;uniform float t;uniform vec2 view;uniform float aspect;varying float light;void main(){vec3 q=p;float a=t*.22+view.x,b=.45+view.y;q.xz=mat2(cos(a),-sin(a),sin(a),cos(a))*q.xz;q.yz=mat2(cos(b),-sin(b),sin(b),cos(b))*q.yz;float depth=4.-q.z;gl_Position=vec4(q.x*2.5/aspect,q.y*2.5,depth-2.,depth);light=.45+.55*(p.y+1.5)/3.;}'),fs=shader(gl.FRAGMENT_SHADER,'precision mediump float;varying float light;uniform vec3 a;uniform vec3 b;void main(){gl_FragColor=vec4(mix(a,b,clamp(light*.9,0.,1.)),1.);}');gl.attachShader(program,vs);gl.attachShader(program,fs);gl.linkProgram(program);gl.deleteShader(vs);gl.deleteShader(fs);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error('Шейдер не собран');const vertices=[];for(let i=0;i<96;i++)for(let j=0;j<12;j++){function p(a,b){const u=a/96*Math.PI*2,v=b/12*Math.PI*2,r=1.08+.16*Math.cos(v);return[r*Math.cos(u),.16*Math.sin(v),r*Math.sin(u)]}vertices.push(...p(i,j),...p(i+1,j),...p(i+1,j+1),...p(i,j),...p(i+1,j+1),...p(i,j+1))}buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(vertices),gl.STATIC_DRAW);gl.useProgram(program);const a=gl.getAttribLocation(program,'p');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,3,gl.FLOAT,false,0,0);gl.enable(gl.DEPTH_TEST);program.count=vertices.length/3}
function draw(now){if(disposed||document.hidden||gl.isContextLost())return;const step=last?Math.min(100,now-last):0;last=now;if(moving&&!matchMedia('(prefers-reduced-motion: reduce)').matches)time+=step*.001*(speed/30);const w=Math.round(canvas.clientWidth*Math.min(devicePixelRatio,1.5)),h=Math.round(canvas.clientHeight*Math.min(devicePixelRatio,1.5));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}gl.viewport(0,0,w,h);gl.clearColor(...palette.background,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.useProgram(program);gl.uniform1f(gl.getUniformLocation(program,'t'),time);gl.uniform2f(gl.getUniformLocation(program,'view'),yaw,pitch);gl.uniform1f(gl.getUniformLocation(program,'aspect'),w/h);gl.uniform3fv(gl.getUniformLocation(program,'a'),palette.a);gl.uniform3fv(gl.getUniformLocation(program,'b'),palette.b);gl.drawArrays(gl.TRIANGLES,0,program.count);raf=setTimeout(()=>requestAnimationFrame(draw),33)}
function toggle(){moving=!moving;label()}pause.onclick=toggle;document.getElementById('reset').onclick=()=>{yaw=pitch=0};let pointer;canvas.onpointerdown=e=>{pointer=[e.clientX,e.clientY,yaw,pitch];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!pointer)return;yaw=pointer[2]+(e.clientX-pointer[0])*.01;pitch=Math.max(-1,Math.min(1,pointer[3]+(e.clientY-pointer[1])*.01))};canvas.onpointerup=canvas.onpointercancel=()=>pointer=null;addEventListener('message',e=>{if(e.source!==parent||e.data?.channel!=='alicekit-input-v1'||e.data.type!=='keydown')return;switch(e.data.key){case'left':yaw-=.12;break;case'right':yaw+=.12;break;case'up':pitch=Math.max(-1,pitch-.12);break;case'down':pitch=Math.min(1,pitch+.12);break;case'enter':toggle()}});canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();clearTimeout(raf);state.textContent='Восстанавливаем графику…'});canvas.addEventListener('webglcontextrestored',()=>{init();last=0;draw(performance.now());state.textContent='Графика восстановлена'});addEventListener('visibilitychange',()=>{clearTimeout(raf);if(!document.hidden){last=0;draw(performance.now())}});addEventListener('pagehide',()=>{disposed=true;clearTimeout(raf);gl.deleteBuffer(buffer);gl.deleteProgram(program)});init();state.textContent='WebGL1 · ресурсы проверены · '+(runtime.edition==='tv'?'версия для пульта':'сенсорное управление');draw(performance.now())
})().catch(e=>document.getElementById('state').textContent=e?.message||'Не удалось загрузить ресурс сцены');
</script></html>
